<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }
  </style>
  <script type="module" src="model-viewer.min.js"></script>
</head>
<body>
  <model-viewer
    id="monogramViewer"
    src="models/architectural_hexagonal_monogram.glb"
    alt="Architectural Hexagonal Monogram 3D"
    orientation="0 90deg 0"
    camera-orbit="0deg 90deg 105%"
    field-of-view="32deg"
    auto-rotate
    rotation-per-second="36deg"
    auto-rotate-delay="0"
    interaction-prompt="none"
    disable-zoom
    disable-pan
    disable-tap
    shadow-intensity="1.2"
    shadow-softness="0.5"
    style="pointer-events: none;"
  ></model-viewer>

  <script>
    // Accessibility check: halt auto-rotate if reduced motion is requested
    (function() {
      try {
        var mv = document.getElementById('monogramViewer');
        if (mv && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          mv.removeAttribute('auto-rotate');
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
