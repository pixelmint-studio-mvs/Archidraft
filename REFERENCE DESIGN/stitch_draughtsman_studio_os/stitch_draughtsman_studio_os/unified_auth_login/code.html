<style>
        /* Blueprint Grid Texture */

                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px; /* Maps to blueprint_unit */
            background-color: theme('colors.background');
        }
        
        /* Subtle crosshairs for tech aesthetic */
        .tech-crosshair::before,
        .tech-crosshair::after {
            content: '';
            position: absolute;
            background-color: theme('colors.outline-variant');
            opacity: 0.5;
        }
        .tech-crosshair::before { width: 20px; height: 1px; top: -10px; left: 50%; transform: translateX(-50%); }
        .tech-crosshair::after { height: 20px; width: 1px; top: -20px; left: 50%; transform: translateX(-50%); }

        /* Custom soft elevation */
        .glass-elevation {

                0 0 0 1px rgba(0, 0, 0, 0.05) inset, /* Inner sharp stroke */
